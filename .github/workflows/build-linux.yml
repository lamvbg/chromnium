name: build-chronium-linux

# Manual trigger + tag-driven. Push a tag like `linux-v0.1.5` and the
# workflow fetches Chromium 148.0.7778.217, applies patches/, builds
# the Linux binary in the runner (~5-6h), and uploads the tar.gz to a
# GitHub release with the same tag name. `workflow_dispatch` lets you
# start a build from the Actions tab without pushing.
on:
  workflow_dispatch:
    inputs:
      chromium_tag:
        description: 'Chromium base tag'
        required: true
        default: '148.0.7778.217'
      release_tag:
        description: 'GitHub release tag to publish under'
        required: true
        default: 'linux-v0.1.5'
  push:
    tags:
      - 'linux-v*'

jobs:
  build:
    # ubuntu-latest has 4 vCPU / 16 GB RAM / ~14 GB disk. The disk is
    # the killer for Chromium (~50 GB needed). We free ~30 GB below by
    # nuking preinstalled Android/.NET/Boost/etc that runners bake in.
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h — GH Actions max for a single job is 6h anyway

    steps:
      # ---- Reclaim disk space ----
      # ubuntu-latest ships with a lot of preinstalled stuff we don't
      # touch during a Chromium build. Removing it frees ~30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache \
                      /usr/share/swift /usr/lib/jvm
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout chronium-build (this repo)
        uses: actions/checkout@v4
        with:
          path: chronium-build

      # ---- Install system prereqs ----
      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-pip curl file lsb-release sudo wget gnupg \
            xz-utils build-essential lld clang \
            pkg-config libnss3-dev libgtk-3-dev libxss-dev libasound2-dev

      # ---- depot_tools ----
      - name: Clone depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                    "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---- Fetch Chromium at pinned tag ----
      # --no-history + explicit tag fetch keeps this under ~30 GB. Full
      # gclient sync pulls another 15-20 GB of submodules.
      - name: Fetch Chromium source
        run: |
          mkdir -p $HOME/cr
          cd $HOME/cr
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {"checkout_pgo_profiles": True},
            },
          ]
          target_os = ["linux"]
          EOF
          gclient sync --nohooks --no-history --revision src@refs/tags/${{ github.event.inputs.chromium_tag || '148.0.7778.217' }} -j 4

      - name: Run hooks (installs Linux toolchain)
        run: |
          cd $HOME/cr
          gclient runhooks

      # ---- Apply chronium patches ----
      # Patches 0001-0018 apply cleanly to a fresh Chromium tree.
      # 0019/0020/0021 were format-patched from a Windows tree that had
      # earlier patches already absorbed, so their diff context doesn't
      # line up. Instead of chasing rebase, we ship the FINAL post-patch
      # copies of the affected files under patches/post-patched/ and
      # cp them on top of the tree, then commit as one squashed change.
      - name: Apply chronium patches
        run: |
          cd $HOME/cr/src
          git config user.email 'chronium@interlink.local'
          git config user.name 'Chronium'

          # 1. git am 0001-0018 (all clean)
          for p in $(ls $GITHUB_WORKSPACE/chronium-build/patches/00{01,02,03,04,05,06,07,08,09,10,11,12,13,14,15,16,17,18}-*.patch 2>/dev/null); do
            echo "Applying $(basename $p) ..."
            if ! git am --keep-cr --3way < "$p"; then
              echo "PATCH 0001-0018 FAILED: $p"
              git am --show-current-patch=diff | head -50
              exit 1
            fi
          done

          # 2. Squash-apply 0019+0020+0021 by overwriting affected files.
          POSTPATCH=$GITHUB_WORKSPACE/chronium-build/patches/post-patched
          if [ -d "$POSTPATCH" ]; then
            echo "Copying post-patched files (0019+0020+0021 squashed) ..."
            cp -rv "$POSTPATCH"/. .
            git add -A
            git commit -m "chronium: patches 0019+0020+0021 (WebGL virt + license gate + account chip)" || true
          fi

          git log --oneline -25

      # ---- Bake license secret from repo secret ----
      # CHRONIUM_LICENSE_KEY_HEX is a GitHub repo secret set once by
      # the dev (Settings → Secrets → Actions → New repository secret).
      # It's 64 hex chars. Below we decode into the C++ constexpr shape
      # the license gate expects.
      - name: Generate license_secret.h
        env:
          KEY_HEX: ${{ secrets.CHRONIUM_LICENSE_KEY_HEX }}
        run: |
          if [ -z "$KEY_HEX" ]; then
            echo "CHRONIUM_LICENSE_KEY_HEX repo secret not set — using zero key (DRM will refuse legitimate launches)"
            KEY_HEX=$(printf '00%.0s' {1..32})
          fi
          if [ "${#KEY_HEX}" -ne 64 ]; then
            echo "CHRONIUM_LICENSE_KEY_HEX must be 64 chars, got ${#KEY_HEX}"; exit 2
          fi
          python3 - <<PY
          import os, textwrap
          key = os.environ['KEY_HEX']
          bytes_arr = ',\n    '.join(
              ', '.join(f'0x{key[i+j*2:i+j*2+2]}' for j in range(8))
              for i in range(0, 64, 16)
          )
          content = f'''// Auto-generated in GitHub Actions from repo secret.
          #ifndef CHROME_BROWSER_LICENSE_LICENSE_SECRET_H_
          #define CHROME_BROWSER_LICENSE_LICENSE_SECRET_H_
          #include <cstdint>
          namespace chronium {{
          inline constexpr uint8_t kLicenseSecret[32] = {{
              {bytes_arr}
          }};
          }}  // namespace chronium
          #endif
          '''
          os.makedirs(os.path.expanduser('~/cr/src/chrome/browser/license'), exist_ok=True)
          with open(os.path.expanduser('~/cr/src/chrome/browser/license/license_secret.h'), 'w') as f:
              f.write(textwrap.dedent(content))
          PY

      # ---- gn gen ----
      - name: gn gen
        run: |
          cd $HOME/cr/src
          mkdir -p out/Release
          cat > out/Release/args.gn <<'GNARGS'
          is_debug = false
          is_component_build = true
          symbol_level = 0
          chrome_pgo_phase = 0
          use_official_google_api_keys = false
          use_thin_lto = false
          enable_widevine = false
          proprietary_codecs = false
          ffmpeg_branding = "Chromium"
          target_cpu = "x64"
          target_os = "linux"
          blink_symbol_level = 0
          v8_symbol_level = 0
          GNARGS
          gn gen out/Release

      # ---- Build ----
      # 4 vCPU × hyperthreading = 8 logical → -j 8. First build ~4-5h
      # on this hardware.
      - name: autoninja chrome
        run: |
          cd $HOME/cr/src
          autoninja -C out/Release chrome -j 8

      # ---- Package tar.gz ----
      - name: Package chronium-linux
        run: |
          cd $HOME/cr/src/out/Release
          # Collect the exact runtime set (mirrors make-package.ps1 minus
          # Windows-only bits). The whole out/Release is ~35 GB but the
          # runtime slice is ~1.5 GB.
          mkdir -p /tmp/chronium/bin
          cp chrome chrome_crashpad_handler /tmp/chronium/bin/ || true
          cp libEGL.so libGLESv2.so libvk_swiftshader.so libvulkan.so.1 \
             vk_swiftshader_icd.json /tmp/chronium/bin/ 2>/dev/null || true
          cp resources.pak chrome_100_percent.pak chrome_200_percent.pak \
             icudtl.dat snapshot_blob.bin v8_context_snapshot.bin \
             /tmp/chronium/bin/
          cp -r Locales /tmp/chronium/bin/
          # 170 encrypted profile JSONs
          mkdir -p /tmp/chronium/config
          cp -r $GITHUB_WORKSPACE/chronium-build/config/profiles /tmp/chronium/config/
          # Python helpers
          cp -r $GITHUB_WORKSPACE/chronium-build/scripts /tmp/chronium/
          echo "${{ github.event.inputs.release_tag || github.ref_name }}" > /tmp/chronium/VERSION

          cd /tmp
          TARBALL=chronium-linux-${{ github.event.inputs.release_tag || github.ref_name }}.tar.gz
          tar czf $TARBALL chronium/
          ls -lh $TARBALL
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "TARBALL_PATH=/tmp/$TARBALL" >> $GITHUB_ENV

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronium-linux-tarball
          path: ${{ env.TARBALL_PATH }}
          retention-days: 30

      # ---- Publish to release ----
      # Only when triggered by tag push; workflow_dispatch keeps artifact
      # available for 30 days but doesn't publish.
      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.TARBALL_PATH }}
          body: |
            Linux build of chronium ${{ github.ref_name }}.

            Built on ubuntu-latest with the same patches 0001-0021 as the
            Windows release at the corresponding Chromium tag. Component
            build, no LTO, ANGLE + Vulkan.

            ## Usage

            See `docker/README.md` for the Docker + Xvfb pattern. Standalone
            launch mirrors the Windows Cach-2 flow but uses `chrome` (no
            `.exe`) inside `bin/`.
